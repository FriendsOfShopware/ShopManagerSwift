name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Test scope (automatic runs always use conservative change detection)
        type: choice
        options: [full, changed, smoke, compatibility]
        default: full
      visual:
        description: Retain screenshots from successful UI tests
        type: boolean
        default: false
      toolchain:
        description: Verify the required or distribution toolchain without publishing
        type: choice
        options: [required, release]
        default: required
      areas:
        description: Optional comma-separated areas for manual changed mode
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      mode: ${{ inputs.mode || 'changed' }}
      visual: ${{ inputs.visual || false }}
      toolchain: ${{ inputs.toolchain || 'required' }}
      areas: ${{ inputs.areas || '' }}
