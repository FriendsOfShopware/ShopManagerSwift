name: TestFlight

# Validate the exact release commit before separately signing and uploading it.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build"
        type: choice
        options: [ios, macos, both]
        default: both
  push:
    tags:
      - "v*"

concurrency:
  # Serialize releases across tags and manual runs before allocating build numbers.
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  # App Store Connect API key (GitHub secrets → Settings → Secrets and variables → Actions)
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
  ASC_KEY_P8_BASE64: "true"
  # Non-interactive fastlane
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      mode: full
      namespace: release
      toolchain: release

  minimum:
    needs: verify
    uses: ./.github/workflows/verify.yml
    with:
      mode: compatibility
      toolchain: minimum
      namespace: release-minimum

  ios:
    needs: [verify, minimum]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require verification of this exact release commit
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.verified-sha }}
          VERIFIED_MODE: ${{ needs.verify.outputs.verified-mode }}
          MINIMUM_SHA: ${{ needs.minimum.outputs.verified-sha }}
          MINIMUM_MODE: ${{ needs.minimum.outputs.verified-mode }}
        run: python3 .github/ci/release_gate.py

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build & upload to TestFlight (iOS)
        run: fastlane ios ci_beta

  macos:
    needs: [verify, minimum]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'macos' || inputs.platform == 'both' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require verification of this exact release commit
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.verified-sha }}
          VERIFIED_MODE: ${{ needs.verify.outputs.verified-mode }}
          MINIMUM_SHA: ${{ needs.minimum.outputs.verified-sha }}
          MINIMUM_MODE: ${{ needs.minimum.outputs.verified-mode }}
        run: python3 .github/ci/release_gate.py

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build & upload to TestFlight (macOS)
        run: fastlane mac ci_beta
