name: Backend contracts

on:
  workflow_call:
    inputs:
      versions:
        type: string
        default: '["v6.6.10.24", "v6.7.14.0"]'
      namespace:
        type: string
        default: contracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ${{ fromJSON(inputs.versions || '["v6.6.10.24", "v6.7.14.0"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install a disposable Shopware service
        uses: shopware/setup-shopware@aad0796c9e6c36a7603a3319c3725871c16ae212
        with:
          shopware-version: ${{ matrix.version }}
          path: backend
          env: e2e
          install: 'true'
          install-admin: 'false'
          install-storefront: 'false'
          skip-js-build: 'true'
      - name: Create isolated contract credentials
        working-directory: backend
        run: |
          php bin/console user:create ci-contract --admin --password=ci-only-disposable-password \
            --firstName=CI --lastName=Contract --email=ci-contract@example.invalid --no-interaction
      - name: Exercise production Swift requests over HTTP
        env:
          CONTRACT_SHOP_URL: http://127.0.0.1:8000
          CONTRACT_USERNAME: ci-contract
          CONTRACT_PASSWORD: ci-only-disposable-password
        run: |
          mkdir -p "$RUNNER_TEMP/contracts"
          docker run --rm --network host -v "$GITHUB_WORKSPACE/Packages:/packages:ro" \
            -w /packages/ShopwareContracts -e CONTRACT_SHOP_URL -e CONTRACT_USERNAME -e CONTRACT_PASSWORD \
            swift:6.2 swift test --scratch-path /tmp/contracts-build 2>&1 | tee "$RUNNER_TEMP/contracts/tests.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.namespace || 'contracts' }}-backend-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/contracts
            backend/var/log/*.log
          retention-days: 14
