name: Upload CI evidence
description: Retry an artifact transfer once without rerunning successful tests

inputs:
  name:
    description: Unique artifact name within this workflow run
    required: true
  path:
    description: Files or directories to upload
    required: true
  retention-days:
    description: Artifact retention in days
    default: '14'
  compression-level:
    description: ZIP compression level
    default: '6'
  if-no-files-found:
    description: Behavior when no files match
    default: warn

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v7
      id: first
      if: ${{ !cancelled() }}
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
    - name: Record transfer retry
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      shell: bash
      run: echo '::warning::Artifact transfer failed; retrying once without rerunning tests.'
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        # The first transfer may have created an incomplete artifact before failing.
        overwrite: true
